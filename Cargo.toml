[package]
name = "night-light-controller"
version = "0.1.0"
edition = "2021"
description = "A small Rust night-light controller for XFCE"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
glib = "0.21"
ksni = "0.3.7"
tokio = { version = "1", features = ["rt", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
